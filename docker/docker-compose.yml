# Qdrant cho ViFinQA retrieval — chạy local qua Docker.
# Storage mount vào data/derived/qdrant (cùng path convention với ETL).
# Chạy:  docker compose -f docker/docker-compose.yml up -d
# Health: curl http://localhost:6333/healthz
# Dashboard: http://localhost:6334
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: vifinqa-qdrant
    ports:
      - "6333:6333"   # REST + gRPC
      - "6334:6334"   # dashboard
    volumes:
      # Named volume (không bind mount) — bind mount Windows gây lỗi optimizer
      # "Permission denied (os error 13)" khi rename segment (6/8/2026). Named volume
      # nằm trong ext4 của Docker VM → rename hoạt động bình thường.
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage: