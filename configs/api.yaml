# ============================================================
# Chạy với API OpenRouter — LLM chính Qwen3.5-9B.
# API key đọc từ env OPENROUTER_API_KEY (hoặc .env).
# ============================================================
paths:
  data_dir: data
  derived_dir: data/derived
  out_dir: data/out

retrieval:
  k: 5
  rerank_depth: 30

sandbox:
  timeout: 20
  max_code_len: 8000
  max_ast_nodes: 800

answer_abs_tol: 0.01
step_budget: 10

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model_id: qwen/qwen3.5-9b
  temperature: 0.0
  max_tokens: 4096   # REVERT (M4b) — cap 2560 làm truncate code → "không trả code" + chặn repair path. 15 câu code-quá-dài nhờ retry rút gọn thành công. Giữ 4096.
  timeout: 30.0
  retries: 1
  extra_headers:
    HTTP-Referer: https://github.com/KimHo-GURU   # optional: định danh nguồn gọi
    X-Title: ViFinQA-GURU                         # optional: tên app trên OpenRouter

retrieval:
  embedding:
    provider: openrouter         # OpenRouter embeddings — nvidia/nemotron-3-embed-1b:free (free, dim 2048)
    model: nvidia/nemotron-3-embed-1b:free
    dense_dim: 2048              # nemotron-3-embed-1b = 2048 (khác bge-m3 1024)
    max_chars: 2000              # chunk ~600-700 token, dưới ctx model
    batch_size: 100              # OpenRouter xử lý batch lớn tốt — không cần batch nhỏ như GPU thuê
    workers: 12                  # song song API calls
    cache_dir: data/derived/embeddings
