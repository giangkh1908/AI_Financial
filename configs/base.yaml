# ============================================================
# Cấu hình gốc — áp cho mọi chạy.
# Các file api.yaml / local_vllm.yaml kế thừa & ghi đè phần llm.
# ============================================================
paths:
  data_dir: data
  derived_dir: data/derived
  out_dir: data/out

retrieval:
  k: 10                    # top-k bảng trả về cho agent (5→10: bảng đúng hay rank 6-8 vd Q19 tỷ lệ biểu quyết, Q7 quỹ khen thưởng)
  rerank_depth: 30         # TEST B: 100→30 — giảm noise sau fusion
  engine: qdrant
  use_dense: true          # Vector Index Search (HNSW) — kênh CHÍNH
  use_sparse: false        # TEST dense-only: sparse TF/IDF gây nhiễu tiếng Việt (miss table_50 Q1 mà dense rank đúng)
  fusion: native           # Qdrant FusionQuery(RRF)
  statement_bonus: 0.01    # TEST A: 0.001→0.01 — nudge statement mạnh hơn cho câu có hint rõ (Q1 VJC Lãi tiền gửi)
  embedding:
    provider: openrouter   # reuse LLMConfig base_url/key
    model: baai/bge-m3
    dense_dim: 1024
    max_chars: 4000        # M3.1: bump từ 2000 (~1K token, bge-m3 ctx 8192) → phủ nhiều row_labels hơn
    batch_size: 100        # texts / 1 API call
    workers: 4             # M3.1: giảm từ 12 — tránh 429 "engine overloaded" từ OpenRouter
    cache_dir: data/derived/embeddings
  sparse:
    max_chars: 6000        # cap text_lex (TF sparse)
    deep_labels_cap: 0     # 0=off (M3); N>0 đọc wide CSV mở rộng labels
  qdrant:
    mode: server           # server (Docker localhost) | local (embedded path, legacy)
    host: localhost
    port: 6333
    path: data/derived/qdrant   # chỉ dùng khi mode=local
    collection: bctc_tables
    hnsw_m: 16
    hnsw_ef_construct: 128
    hnsw_on_disk: true
    quantize: true         # INT8 scalar quantization dense
    sparse_on_disk: true
    sparse_modifier: idf
  rerank:
    enabled: false         # 8/8 test xong: VN-reranker GPU chậm (~5.8s/câu) + gây regress (id 2 timeout, 3/9 đổi sai) và không sửa được zeros (ETL unit / retrieval). Tắt.
    provider: local        # disabled; nếu bật lại: 'local' (self-host) hoặc 'api' (sau này)
    model: "AITeamVN/Vietnamese_Reranker"   # VN-tuned (base bge-v2-m3), Apache-2.0, tốt nhất tiếng Việt
    device: cuda
    candidates: 20         # rerank top-20 (bảng đúng thường trong top-20 hybrid); giảm candidates → nhanh hơn
    top_k: 10
    max_chars_per_doc: 300  # chuỗi ngắn → inference nhanh hơn trên GPU yếu
    batch_size: 16
    use_instruction: true
  embed_statement_only: false   # M4: index TOÀN bộ 146K bảng (gồm notes/thuyết minh) — nhiều câu hỏi nhắm notes items (Lãi tiền gửi, cho vay ngành X...); statement-only bỏ sót ~91% bảng
  min_n_rows: 5            # bỏ bảng junk/TOC

sandbox:
  timeout: 20        # giây, chạy pandas_query
  max_code_len: 8000
  max_ast_nodes: 800

answer_abs_tol: 0.01  # tolerance đáp án (giả định theo paper)
step_budget: 10       # số bước tối đa trong ReAct loop

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model_id: qwen/qwen3.5-9b
  temperature: 0.0
  max_tokens: 4096
  timeout: 60.0
  retries: 3
